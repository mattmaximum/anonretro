# /etc/nginx/sites-available/anonretro-staging
# After placing this file:
#   sudo ln -s /etc/nginx/sites-available/anonretro-staging /etc/nginx/sites-enabled/
#   sudo htpasswd -c /etc/nginx/.htpasswd-staging <username>
#   sudo certbot --nginx -d staging.anonretro.com
#   sudo nginx -s reload

server {
    listen 80;
    server_name staging.anonretro.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.anonretro.com;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/staging.anonretro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.anonretro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket — must come before the catch-all location
    location /ws {
        auth_basic "Staging";
        auth_basic_user_file /etc/nginx/.htpasswd-staging;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else → Node (serves API + built frontend)
    location / {
        auth_basic "Staging";
        auth_basic_user_file /etc/nginx/.htpasswd-staging;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
